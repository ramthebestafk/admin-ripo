<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Well Being Council Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 40px 20px; max-width: 850px; margin: 0 auto; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 24px; }
    .login-box { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; max-width: 400px; margin: 60px auto; text-align: center; }
    input[type="password"] { width: 100%; padding: 12px; margin: 16px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 16px; }
    button { padding: 12px 24px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    .section-title { color: #38bdf8; margin-top: 32px; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 18px; border-radius: 10px; margin-bottom: 14px; border-left: 4px solid #38bdf8; position: relative; }
    .card.appt-card { border-left-color: #4ade80; }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #94a3b8; margin-bottom: 8px; padding-right: 80px; }
    .sender { font-weight: 600; color: #f3f4f6; }
    .message { font-size: 15px; line-height: 1.5; color: #e2e8f0; white-space: pre-wrap; }
    .time { font-size: 12px; color: #64748b; }
    .delete-btn { position: absolute; top: 16px; right: 16px; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; width: auto; }
    .delete-btn:hover { background: #dc2626; }
    .badge { background: #0f172a; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155; color: #38bdf8; font-size: 13px; display: inline-block; margin-top: 6px; }
  </style>
</head>
<body>

<div id="authContainer" class="login-box">
  <h3 style="margin-top:0;">Admin Authentication</h3>
  <input type="password" id="passInput" placeholder="Enter Admin Password">
  <button id="loginBtn">Access Dashboard</button>
  <p id="authErr" style="color: #f87171; font-size: 14px; display: none; margin-top: 12px;">Incorrect Password</p>
</div>

<div id="dashboard" style="display: none;">
  <h1>Well Being Council Admin Dashboard</h1>

  <div class="section-title">📅 Booked Appointments</div>
  <div id="appointmentsList" style="margin-top: 16px;">Loading appointments...</div>

  <div class="section-title">💡 Idea Submissions</div>
  <div id="messagesList" style="margin-top: 16px;">Loading submissions...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const ADMIN_PASSWORD = "ram";

  const firebaseConfig = {
    apiKey: "AIzaSyA9Wd5qG4WoqeTddqcEtUhNmozNVey-QAQ",
    authDomain: "your-ideas-cf3aa.firebaseapp.com",
    projectId: "your-ideas-cf3aa",
    storageBucket: "your-ideas-cf3aa.firebasestorage.app",
    messagingSenderId: "87169584274",
    appId: "1:87169584274:web:c9de1e697ec52018c8aa4b",
    measurementId: "G-V24TCX08LE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("loginBtn").addEventListener("click", () => {
    if (document.getElementById("passInput").value === ADMIN_PASSWORD) {
      document.getElementById("authContainer").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadData();
    } else {
      document.getElementById("authErr").style.display = "block";
    }
  });

  function loadData() {
    // 1. Load Appointments
    const apptList = document.getElementById("appointmentsList");
    const qAppts = query(collection(db, "appointments"), orderBy("createdAt", "desc"));

    onSnapshot(qAppts, (snapshot) => {
      apptList.innerHTML = "";
      if (snapshot.empty) {
        apptList.innerHTML = "<p style='color: #94a3b8;'>No booked appointments yet.</p>";
      } else {
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;
          const card = document.createElement("div");
          card.className = "card appt-card";
          card.innerHTML = `
            <button class="delete-btn" data-col="appointments" data-id="${docId}">Cancel / Delete</button>
            <div class="card-header">
              <span class="sender">Student: ${data.name} (${data.studentClass || 'No Class'})</span>
              <span class="time">Date: ${data.date}</span>
            </div>
            <div class="message"><strong>Topic:</strong> ${data.topic}</div>
            <div class="badge">⏰ Slot: ${data.slot}</div>
          `;
          apptList.appendChild(card);
        });
      }
      attachDeleteListeners();
    });

    // 2. Load Messages
    const msgList = document.getElementById("messagesList");
    const qMsgs = query(collection(db, "submissions"), orderBy("createdAt", "desc"));

    onSnapshot(qMsgs, (snapshot) => {
      msgList.innerHTML = "";
      if (snapshot.empty) {
        msgList.innerHTML = "<p style='color: #94a3b8;'>No messages received yet.</p>";
      } else {
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;
          const dateStr = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString() : "Just now";
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <button class="delete-btn" data-col="submissions" data-id="${docId}">Delete</button>
            <div class="card-header">
              <span class="sender">From: ${data.name || 'Anonymous'} (${data.studentClass || 'No Class'})</span>
              <span class="time">${dateStr}</span>
            </div>
            <div class="message">${data.message}</div>
          `;
          msgList.appendChild(card);
        });
      }
      attachDeleteListeners();
    });
  }

  function attachDeleteListeners() {
    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.onclick = async (e) => {
        const id = e.target.getAttribute("data-id");
        const col = e.target.getAttribute("data-col");
        if (confirm("Are you sure you want to delete this entry?")) {
          await deleteDoc(doc(db, col, id));
        }
      };
    });
  }
</script>
</body>
</html>
